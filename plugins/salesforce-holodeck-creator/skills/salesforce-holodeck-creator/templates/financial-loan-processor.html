<style>
    body { background: var(--lc-page); min-height: 100vh; --sf-w: 1560px; }
    .fls-page { width: min(var(--sf-w), 100%); margin: 0 auto; padding: 18px 20px 72px; display: grid; gap: 16px; }
    .fls-grid { display: grid; grid-template-columns: minmax(270px, 320px) minmax(0, 1fr) minmax(320px, 390px); gap: 16px; align-items: start; }
    .fls-main, .fls-rail { display: grid; gap: 16px; }
    .fls-record-tabs { display: flex; gap: 24px; padding: 0 16px; border-bottom: 1px solid var(--lc-border-subtle); background: #fff; border-radius: 8px 8px 0 0; }
    .fls-record-tabs span { padding: 15px 3px 12px; color: var(--lc-text-secondary); font-weight: 600; }
    .fls-record-tabs .on { color: var(--lc-brand); border-bottom: 3px solid var(--lc-brand); }
    @media (max-width: 1150px) { .fls-grid { grid-template-columns: minmax(250px, 300px) minmax(0, 1fr); } .fls-agent { grid-column: 1 / -1; } }
    @media (max-width: 760px) { .fls-grid { grid-template-columns: 1fr; } .fls-agent { grid-column: auto; } }
</style>
