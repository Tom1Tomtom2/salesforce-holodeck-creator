<!DOCTYPE html>
<!-- ┌─────────────────────────────────────────────────────────────────────┐
     │ TEMPLATE — Lightning : Field Service (desktop)                        │
     │ CHROME VERROUILLÉE : header Lightning + composants <lc-*> du kit.      │
     │ Dispatch console + carte + roster + work order + pièces + itinéraire.  │
     │ NE MODIFIE QUE le JSON entre les marqueurs SLOT (autour des <script>). │
     │ Le panneau lc-ai-recommendation (Einstein/optimisation) = clin d'œil.  │
     └─────────────────────────────────────────────────────────────────────┘ -->
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title><!-- SLOT: title -->Lightning — Field Service<!-- /SLOT --></title>
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="lightning-kit.css">
<style>
    body { background: var(--lc-page); min-height: 100vh; --sf-w: 1480px; }
    .fs-page { width: min(var(--sf-w), 100%); margin: 0 auto; padding: 18px 20px 72px; display: grid; gap: 16px; }
    .fs-title { margin: 4px 0 0; color: var(--lc-heading); font-size: 26px; font-weight: 400; }
    /* Colonnes SLDS : 2/3 (canvas opérationnel) | 1/3 (contexte + Einstein). UNE seule grille → tout aligné,
       les composants vivent chacun dans une colonne de largeur définie (pas de grilles empilées qui décrochent). */
    .fs-body { display: grid; grid-template-columns: minmax(0, 2fr) minmax(320px, 1fr); gap: 16px; align-items: start; }
    .fs-main, .fs-rail { display: grid; gap: 16px; }
    @media (max-width: 1050px) { .fs-body { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="act-tag"><!-- SLOT: act-tag -->Acte 1 · Lightning — console de répartition Field Service<!-- /SLOT --></div>

<!-- ═══ Header Salesforce Lightning (chrome verrouillée). Ne modifie que sf-logo / sf-app / sf-tabs / sf-avatar. ═══ -->
<div class="lightning">
    <div class="ln-top">
        <!-- SLOT: sf-logo ─ logo du CLIENT (remplace le cloud Salesforce) : wordmark .brand, ou une balise img de classe brand-logo pointant sur le logo fourni. -->
        <span class="ln-logo"><span class="brand"><span class="brand-mark">N</span> Nova</span></span>
        <!-- /SLOT: sf-logo -->
        <div class="ln-search">
            <svg viewBox="0 0 520 520" fill="currentColor"><path d="M496 453 362 320a189 189 0 1 0-340-92 190 190 0 0 0 298 135l133 133a14 14 0 0 0 21 0l21-21a17 17 0 0 0 1-22M210 338a129 129 0 1 1 130-130 129 129 0 0 1-130 130"/></svg>
            Search…
        </div>
        <span class="ln-ask"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4z"/></svg> Ask</span>
        <div class="ln-icons">
            <svg viewBox="0 0 520 520" fill="currentColor"><path d="m274 31 46 150c2 6 8 9 14 9h150c15 0 21 20 9 29l-122 90c-5 4-7 11-5 17l58 154c4 14-11 26-23 17l-131-98c-5-4-12-4-18 0l-132 98c-12 9-28-3-23-17l56-154c2-6 0-13-5-17L26 219c-12-9-5-29 9-29h150c7 0 12-2 14-9l47-151c4-14 24-13 28 1"/></svg>
            <svg viewBox="0 0 520 520" fill="currentColor"><path d="M284 380h-50c-8 0-14-6-14-14v-15c0-42 27-80 67-94a80 80 0 0 0-24-155c-22-1-43 7-59 22a70.4 70.4 0 0 0-23 44c-1 6-7 11-15 11h-50c-9 0-16-7-15-16 4-38 21-72 48-99 32-30 73-46 117-45 83 3 151 71 154 154 3 70-40 133-105 157-9 4-15 11-15 20v15c0 9-8 15-16 15m16 105c0 8-7 15-15 15h-50c-8 0-15-7-15-15v-50c0-8 7-15 15-15h50c8 0 15 7 15 15z"/></svg>
            <svg viewBox="0 0 520 520" fill="currentColor"><path d="M261 191c-39 0-70 31-70 70s31 70 70 70 70-31 70-70-31-70-70-70m210 133-37-31a195 195 0 0 0 0-68l37-31c12-10 16-28 8-42l-16-28a34 34 0 0 0-40-14l-46 17a168 168 0 0 0-59-34l-8-47c-3-16-17-25-33-25h-32c-16 0-30 9-33 25l-8 46a180 180 0 0 0-60 34l-46-17-11-2c-12 0-23 6-29 16l-16 28c-8 14-5 32 8 42l37 31a195 195 0 0 0 0 68l-37 31a34 34 0 0 0-8 42l16 28a34 34 0 0 0 40 14l46-17c18 16 38 27 59 34l8 48a33 33 0 0 0 33 27h32c16 0 30-12 33-28l8-48a170 170 0 0 0 62-37l43 17 12 2c12 0 23-6 29-16l15-26c9-11 5-29-7-39m-210 47c-61 0-110-49-110-110s49-110 110-110 110 49 110 110-49 110-110 110"/></svg>
            <span class="ln-bell"><svg viewBox="0 0 520 520" fill="currentColor"><path d="M460 330h-5a35 35 0 0 1-35-35V180A160 160 0 0 0 252 20c-86 4-152 78-152 165v111c0 19-16 34-35 34h-5c-22 0-40 19-40 41v15c0 7 7 14 15 14h450c8 0 15-7 15-15v-15a40 40 0 0 0-40-40M309 440h-98a10 10 0 0 0-10 12c5 28 30 48 59 48s54-21 59-48a10 10 0 0 0-10-12"/></svg><span class="badge">8</span></span>
            <!-- SLOT: sf-avatar ─ photo de l'utilisateur SF (haut droite). <img class="ln-avatar" src="people/…" alt="">, ou <span class="ln-avatar"></span> pour le dégradé. -->
            <img class="ln-avatar" src="people/homme-1.jpg" alt="">
            <!-- /SLOT: sf-avatar -->
        </div>
    </div>
    <div class="ln-nav">
        <span class="ln-waffle"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
        <!-- SLOT: sf-app ─ nom de l'app Salesforce (ex. Field Service). -->
        <span class="ln-app">Field Service</span>
        <!-- /SLOT: sf-app -->
        <!-- SLOT: sf-tabs ─ onglets. Le 1er en .ln-tab.on = actif (souligné bleu). Ajoute la <svg class="caret"> pour un menu déroulant. -->
        <div class="ln-tabs">
            <span class="ln-tab on">Dispatch</span>
            <span class="ln-tab">Interventions <svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></span>
            <span class="ln-tab">Techniciens</span>
            <span class="ln-tab">Tableaux de bord</span>
        </div>
        <!-- /SLOT: sf-tabs -->
    </div>
</div>

<main class="fs-page">
    <h1 class="fs-title"><!-- SLOT: heading -->Opérations Field Service<!-- /SLOT --></h1>

    <section class="fs-body">
        <!-- Colonne 2/3 : canvas opérationnel (répartition → carte → pièces) -->
        <div class="fs-main">
            <!-- SLOT: dispatch ─ console de répartition (lc-dispatch-console). Garde le <script JSON> ; ajuste technicians/appointments. -->
            <lc-dispatch-console>
                <script type="application/json">
                {
                  "title": "Console de répartition", "date": "5 août 2026", "startHour": 8, "endHour": 18,
                  "technicians": [
                    { "initials": "LD", "name": "Léa Durand", "territory": "Paris Centre", "appointments": [
                      { "title": "Data Center Alpha", "start": "09:00", "end": "10:30", "status": "Terminé" },
                      { "title": "Trajet", "start": "10:30", "end": "11:15", "status": "Trajet" },
                      { "title": "Nova HQ", "start": "11:15", "end": "12:45", "status": "Sur site" },
                      { "title": "Site République", "start": "14:00", "end": "15:30", "status": "Planifié" }
                    ] },
                    { "initials": "ML", "name": "Marc Leroy", "territory": "Paris Ouest", "appointments": [
                      { "title": "Panne fibre", "start": "08:30", "end": "10:00", "status": "Terminé" },
                      { "title": "Nanterre HQ", "start": "11:00", "end": "13:00", "status": "Planifié" }
                    ] },
                    { "initials": "SB", "name": "Sofia Benali", "territory": "Paris Est", "appointments": [
                      { "title": "Inspection solaire", "start": "09:00", "end": "11:00", "status": "Planifié" },
                      { "title": "Entrepôt Est", "start": "11:30", "end": "13:30", "status": "Critique", "conflict": true },
                      { "title": "Échange batterie", "start": "13:00", "end": "15:00", "status": "Planifié", "conflict": true }
                    ] }
                  ]
                }
                </script>
            </lc-dispatch-console>
            <!-- /SLOT: dispatch -->

            <!-- SLOT: map ─ carte SVG locale (lc-map). Garde le <script JSON> ; ajuste markers (x/y en %). -->
            <lc-map>
                <script type="application/json">
                {
                  "title": "Territoire · Île-de-France", "meta": "6 rendez-vous · positions en direct",
                  "accessibleLabel": "Carte fictive des interventions en Île-de-France",
                  "markers": [
                    { "label": "Data Center Alpha", "address": "Saint-Denis", "status": "Sur site", "technician": "Léa Durand", "time": "09:00–10:30", "x": 43, "y": 22 },
                    { "label": "Nova HQ", "address": "Paris 8e", "status": "En route", "technician": "Marc Leroy", "time": "10:45–12:00", "x": 51, "y": 46 },
                    { "label": "Entrepôt Est", "address": "Noisy-le-Grand", "status": "Critique", "technician": "Sofia Benali", "time": "11:30–13:00", "x": 80, "y": 58 },
                    { "label": "Campus Sud", "address": "Massy", "status": "Terminé", "technician": "Hugo Martin", "time": "08:00–09:30", "x": 48, "y": 80 }
                  ]
                }
                </script>
            </lc-map>
            <!-- /SLOT: map -->

            <!-- SLOT: parts ─ pièces & stock (lc-parts-inventory). Garde le <script JSON> ; ajuste parts. -->
            <lc-parts-inventory>
                <script type="application/json">
                {
                  "title": "Pièces requises", "meta": "Léa Durand · Camion 14",
                  "parts": [
                    { "sku": "FAN-420", "name": "Ventilateur", "required": 1, "vanStock": 1 },
                    { "sku": "FLT-HEPA", "name": "Filtre HEPA", "required": 2, "vanStock": 4 },
                    { "sku": "SNS-TEMP", "name": "Capteur température", "required": 1, "vanStock": 0 }
                  ]
                }
                </script>
            </lc-parts-inventory>
            <!-- /SLOT: parts -->
        </div>

        <!-- Colonne 1/3 : contexte technicien + intervention + Einstein -->
        <aside class="fs-rail">
            <!-- SLOT: roster ─ liste des techniciens (lc-technician-roster). Garde le <script JSON> ; ajuste technicians. -->
            <lc-technician-roster>
                <script type="application/json">
                {
                  "title": "Techniciens", "meta": "4 ressources · Île-de-France",
                  "technicians": [
                    { "initials": "LD", "name": "Léa Durand", "skills": ["CVC", "Électricité"], "status": "Sur site", "workload": "3/4 interv." },
                    { "initials": "ML", "name": "Marc Leroy", "skills": ["Réseau", "Fibre"], "status": "En route", "workload": "2/4 interv." },
                    { "initials": "SB", "name": "Sofia Benali", "skills": ["Solaire", "Batterie"], "status": "Disponible", "workload": "1/4 interv." },
                    { "initials": "HM", "name": "Hugo Martin", "skills": ["CVC", "Sécurité"], "status": "Terminé", "workload": "4/4 interv." }
                  ]
                }
                </script>
            </lc-technician-roster>
            <!-- /SLOT: roster -->

            <!-- SLOT: appointment ─ résumé de rendez-vous (lc-service-appointment). Garde le <script JSON> ; ajuste details. -->
            <lc-service-appointment>
                <script type="application/json">
                {
                  "title": "Data Center Alpha · Refroidissement", "number": "SA-0001842",
                  "status": "Sur site", "time": "09:00", "duration": "90 minutes",
                  "address": "12 rue de la Data, 93200 Saint-Denis",
                  "primaryAction": "Clôturer l'intervention",
                  "details": [
                    { "label": "Technicien", "value": "Léa Durand" },
                    { "label": "Territoire", "value": "Paris Centre" },
                    { "label": "Priorité", "value": "Haute" },
                    { "label": "SLA", "value": "2 h restantes" }
                  ]
                }
                </script>
            </lc-service-appointment>
            <!-- /SLOT: appointment -->

            <!-- SLOT: workorder ─ ordre de travail + checklist (lc-work-order). Garde le <script JSON> ; ajuste fields/checklist. -->
            <lc-work-order>
                <script type="application/json">
                {
                  "title": "Remplacer le ventilateur de refroidissement", "number": "WO-0004721", "priority": "Haute",
                  "fields": [
                    { "label": "Équipement", "value": "Unité CRAC DC-A-04" },
                    { "label": "Compte", "value": "Data Center Alpha" },
                    { "label": "Code panne", "value": "FAN-OVERHEAT" },
                    { "label": "Durée estimée", "value": "90 min" }
                  ],
                  "checklist": [
                    { "label": "Valider consignation et périmètre", "done": true },
                    { "label": "Relever le diagnostic initial", "done": true },
                    { "label": "Remplacer le ventilateur", "done": false },
                    { "label": "Test de température", "done": false },
                    { "label": "Signature client", "done": false }
                  ]
                }
                </script>
            </lc-work-order>
            <!-- /SLOT: workorder -->

            <!-- SLOT: assistant ─ CLIN D'ŒIL PRODUIT (lc-ai-recommendation = Einstein optimisation). Garde ce panneau : c'est la valeur Salesforce de l'écran. -->
            <lc-ai-recommendation>
                <script type="application/json">
                {
                  "title": "Einstein · Optimisation", "label": "Conflit détecté",
                  "suggestion": "Sofia Benali a 2 rendez-vous qui se chevauchent (11:30 et 13:00). Réaffecter l'échange batterie à Marc Leroy, disponible à 13:00 à 4 km.",
                  "acceptLabel": "Réaffecter", "editLabel": "Voir les options",
                  "draft": "Impact : 0 SLA dépassé, +6 min de trajet pour Marc, tournée de Sofia rééquilibrée."
                }
                </script>
            </lc-ai-recommendation>
            <!-- /SLOT: assistant -->
        </aside>
    </section>
</main>

<lc-toast-region></lc-toast-region>
<!-- Kit de composants <lc-*> bundlé en script classique (marche en file://, zéro serveur). -->
<script src="lightning-kit.js"></script>
</body>
</html>
