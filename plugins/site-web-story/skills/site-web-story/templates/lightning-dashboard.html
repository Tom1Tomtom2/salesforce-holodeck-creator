<!DOCTYPE html>
<!-- ┌─────────────────────────────────────────────────────────────────────┐
     │ TEMPLATE — Lightning : tableau de bord CRM Analytics (desktop)        │
     │ CHROME VERROUILLÉE : header Lightning + composants <lc-*> du kit.      │
     │ Filtres + KPI + graphiques (donut/jauge/courbe/barres) + classement.  │
     │ NE MODIFIE QUE le JSON entre les marqueurs SLOT (autour des <script>). │
     │ Le panneau lc-ai-recommendation (Einstein) EST le clin d'œil produit. │
     └─────────────────────────────────────────────────────────────────────┘ -->
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title><!-- SLOT: title -->Lightning — Tableau de bord<!-- /SLOT --></title>
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="lightning-kit.css">
<style>
    body { background: var(--lc-page); min-height: 100vh; --sf-w: 1440px; }
    .db-page { width: min(var(--sf-w), 100%); margin: 0 auto; padding: 18px 20px 72px; display: grid; gap: 16px; }
    .db-title { margin: 4px 0 0; color: var(--lc-heading); font-size: 26px; font-weight: 400; }
    .db-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
    .db-grid .wide { grid-column: 1 / -1; }
    .db-split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 360px); gap: 16px; align-items: start; }
    @media (max-width: 1000px) { .db-grid, .db-split { grid-template-columns: 1fr; } .db-grid .wide { grid-column: auto; } }
</style>
</head>
<body>
<div class="act-tag"><!-- SLOT: act-tag -->Acte 1 · Lightning — tableau de bord CRM Analytics<!-- /SLOT --></div>

<!-- ═══ Header Salesforce Lightning (chrome verrouillée). Ne modifie que sf-logo / sf-app / sf-tabs / sf-avatar. ═══ -->
<div class="lightning">
    <div class="ln-top">
        <!-- SLOT: sf-logo ─ logo du CLIENT (remplace le cloud Salesforce) : wordmark .brand, ou une balise img de classe brand-logo pointant sur le logo fourni. -->
        <span class="ln-logo"><span class="brand"><span class="brand-mark">N</span> Nova</span></span>
        <!-- /SLOT: sf-logo -->
        <div class="ln-search">
            <svg viewBox="0 0 520 520" fill="currentColor"><path d="M496 453 362 320a189 189 0 1 0-340-92 190 190 0 0 0 298 135l133 133a14 14 0 0 0 21 0l21-21a17 17 0 0 0 1-22M210 338a129 129 0 1 1 130-130 129 129 0 0 1-130 130"/></svg>
            Search…
        </div>
        <span class="ln-ask"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4z"/></svg> Ask</span>
        <div class="ln-icons">
            <svg viewBox="0 0 520 520" fill="currentColor"><path d="m274 31 46 150c2 6 8 9 14 9h150c15 0 21 20 9 29l-122 90c-5 4-7 11-5 17l58 154c4 14-11 26-23 17l-131-98c-5-4-12-4-18 0l-132 98c-12 9-28-3-23-17l56-154c2-6 0-13-5-17L26 219c-12-9-5-29 9-29h150c7 0 12-2 14-9l47-151c4-14 24-13 28 1"/></svg>
            <svg viewBox="0 0 520 520" fill="currentColor"><path d="M284 380h-50c-8 0-14-6-14-14v-15c0-42 27-80 67-94a80 80 0 0 0-24-155c-22-1-43 7-59 22a70.4 70.4 0 0 0-23 44c-1 6-7 11-15 11h-50c-9 0-16-7-15-16 4-38 21-72 48-99 32-30 73-46 117-45 83 3 151 71 154 154 3 70-40 133-105 157-9 4-15 11-15 20v15c0 9-8 15-16 15m16 105c0 8-7 15-15 15h-50c-8 0-15-7-15-15v-50c0-8 7-15 15-15h50c8 0 15 7 15 15z"/></svg>
            <svg viewBox="0 0 520 520" fill="currentColor"><path d="M261 191c-39 0-70 31-70 70s31 70 70 70 70-31 70-70-31-70-70-70m210 133-37-31a195 195 0 0 0 0-68l37-31c12-10 16-28 8-42l-16-28a34 34 0 0 0-40-14l-46 17a168 168 0 0 0-59-34l-8-47c-3-16-17-25-33-25h-32c-16 0-30 9-33 25l-8 46a180 180 0 0 0-60 34l-46-17-11-2c-12 0-23 6-29 16l-16 28c-8 14-5 32 8 42l37 31a195 195 0 0 0 0 68l-37 31a34 34 0 0 0-8 42l16 28a34 34 0 0 0 40 14l46-17c18 16 38 27 59 34l8 48a33 33 0 0 0 33 27h32c16 0 30-12 33-28l8-48a170 170 0 0 0 62-37l43 17 12 2c12 0 23-6 29-16l15-26c9-11 5-29-7-39m-210 47c-61 0-110-49-110-110s49-110 110-110 110 49 110 110-49 110-110 110"/></svg>
            <span class="ln-bell"><svg viewBox="0 0 520 520" fill="currentColor"><path d="M460 330h-5a35 35 0 0 1-35-35V180A160 160 0 0 0 252 20c-86 4-152 78-152 165v111c0 19-16 34-35 34h-5c-22 0-40 19-40 41v15c0 7 7 14 15 14h450c8 0 15-7 15-15v-15a40 40 0 0 0-40-40M309 440h-98a10 10 0 0 0-10 12c5 28 30 48 59 48s54-21 59-48a10 10 0 0 0-10-12"/></svg><span class="badge">8</span></span>
            <!-- SLOT: sf-avatar ─ photo de l'utilisateur SF (haut droite). <img class="ln-avatar" src="people/…" alt="">, ou <span class="ln-avatar"></span> pour le dégradé. -->
            <img class="ln-avatar" src="people/femme-2.jpg" alt="">
            <!-- /SLOT: sf-avatar -->
        </div>
    </div>
    <div class="ln-nav">
        <span class="ln-waffle"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
        <!-- SLOT: sf-app ─ nom de l'app Salesforce (ex. Sales, Service, Analytics). -->
        <span class="ln-app">Analytics</span>
        <!-- /SLOT: sf-app -->
        <!-- SLOT: sf-tabs ─ onglets. Le 1er en .ln-tab.on = actif (souligné bleu). Ajoute la <svg class="caret"> pour un menu déroulant. -->
        <div class="ln-tabs">
            <span class="ln-tab on">Tableau de bord</span>
            <span class="ln-tab">Rapports <svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></span>
            <span class="ln-tab">Jeux de données</span>
        </div>
        <!-- /SLOT: sf-tabs -->
    </div>
</div>

<main class="db-page">
    <h1 class="db-title"><!-- SLOT: heading -->Performance commerciale<!-- /SLOT --></h1>

    <!-- SLOT: filters ─ barre de filtres (lc-dashboard-filters). Garde le <script JSON> ; ajuste filters. -->
    <lc-dashboard-filters>
        <script type="application/json">
        {
          "title": "Performance commerciale", "meta": "Dernier rafraîchissement : à l'instant",
          "filters": [
            { "label": "Période", "value": "Ce mois-ci", "options": ["Aujourd'hui", "Cette semaine", "Ce mois-ci", "Ce trimestre"] },
            { "label": "Région", "value": "Toutes régions", "options": ["Toutes régions", "France", "Europe", "International"] },
            { "label": "Canal", "value": "Tous canaux", "options": ["Tous canaux", "E-commerce", "Boutique", "Marketplace"] }
          ]
        }
        </script>
    </lc-dashboard-filters>
    <!-- /SLOT: filters -->

    <!-- SLOT: kpis ─ cartes KPI (lc-kpi-grid). Garde le <script JSON> ; ajuste items (label/value/trend/progress). -->
    <lc-kpi-grid>
        <script type="application/json">
        {
          "label": "Indicateurs clés",
          "items": [
            { "label": "Chiffre d'affaires", "value": "1,24 M€", "trend": "+12 % vs mois dernier", "progress": 78 },
            { "label": "Taux de conversion", "value": "3,8 %", "trend": "+0,4 pt", "progress": 62 },
            { "label": "Panier moyen", "value": "142 €", "trend": "+9 €", "progress": 71 },
            { "label": "Clients actifs", "value": "18 420", "trend": "+6 %", "progress": 84 }
          ]
        }
        </script>
    </lc-kpi-grid>
    <!-- /SLOT: kpis -->

    <div class="db-split">
        <div class="db-grid">
            <!-- SLOT: donut ─ répartition (lc-chart-donut). Garde le <script JSON> ; ajuste items. -->
            <lc-chart-donut>
                <script type="application/json">
                {
                  "title": "Ventes par canal", "meta": "Ce mois-ci", "centerValue": "1,24 M€", "centerLabel": "CA",
                  "items": [
                    { "label": "E-commerce", "value": 620, "display": "620 k€", "color": "#0176d3" },
                    { "label": "Boutique", "value": 420, "display": "420 k€", "color": "#2e844a" },
                    { "label": "Marketplace", "value": 200, "display": "200 k€", "color": "#9050e9" }
                  ]
                }
                </script>
            </lc-chart-donut>
            <!-- /SLOT: donut -->

            <!-- SLOT: gauge ─ jauge d'objectif (lc-chart-gauge). Garde le <script JSON> ; ajuste value/label. -->
            <lc-chart-gauge>
                <script type="application/json">
                {
                  "title": "Objectif trimestriel", "meta": "Cible 90 %", "value": 82, "display": "82 %",
                  "min": 0, "max": 100, "label": "En bonne voie", "color": "#2e844a"
                }
                </script>
            </lc-chart-gauge>
            <!-- /SLOT: gauge -->

            <!-- SLOT: trend ─ courbe temporelle (lc-chart-line). Garde le <script JSON> ; ajuste labels/series. -->
            <lc-chart-line class="wide">
                <script type="application/json">
                {
                  "title": "Ventes vs objectif", "meta": "7 derniers jours",
                  "labels": ["Lun", "Mar", "Mer", "Jeu", "Ven", "Sam", "Dim"],
                  "series": [
                    { "label": "Ventes", "color": "#0176d3", "values": [52, 61, 58, 64, 72, 88, 81] },
                    { "label": "Objectif", "color": "#9050e9", "values": [58, 60, 62, 64, 70, 76, 80] }
                  ]
                }
                </script>
            </lc-chart-line>
            <!-- /SLOT: trend -->

            <!-- SLOT: bars ─ barres horizontales (lc-chart-bar). Garde le <script JSON> ; ajuste items. -->
            <lc-chart-bar>
                <script type="application/json">
                {
                  "title": "Ventes par région", "meta": "Ce mois-ci",
                  "items": [
                    { "label": "France", "value": 126, "display": "126" },
                    { "label": "Europe", "value": 104, "display": "104" },
                    { "label": "International", "value": 58, "display": "58" }
                  ]
                }
                </script>
            </lc-chart-bar>
            <!-- /SLOT: bars -->

            <!-- SLOT: leaderboard ─ classement (lc-leaderboard). Garde le <script JSON> ; ajuste items. -->
            <lc-leaderboard>
                <script type="application/json">
                {
                  "title": "Top conseillers", "meta": "Score qualité & ventes",
                  "items": [
                    { "initials": "LD", "name": "Léa Durand", "subtitle": "Paris", "value": "98", "status": "Disponible" },
                    { "initials": "HM", "name": "Hugo Martin", "subtitle": "Lyon", "value": "95", "status": "En ligne" },
                    { "initials": "SB", "name": "Sofia Benali", "subtitle": "Lille", "value": "92", "status": "En ligne" }
                  ]
                }
                </script>
            </lc-leaderboard>
            <!-- /SLOT: leaderboard -->
        </div>

        <!-- SLOT: insight ─ CLIN D'ŒIL PRODUIT (lc-ai-recommendation = Einstein). Garde ce panneau : c'est la valeur Salesforce de l'écran. -->
        <lc-ai-recommendation>
            <script type="application/json">
            {
              "title": "Einstein · Analytics", "label": "Insight détecté",
              "suggestion": "Les ventes e-commerce accélèrent (+12 %) mais la conversion boutique stagne. Recommander une campagne de trafic magasin ciblée sur les clients omnicanaux.",
              "acceptLabel": "Créer la campagne", "editLabel": "Détails",
              "draft": "Segment suggéré : clients ayant consulté en ligne sans achat boutique sur 30 j (≈ 3 200 profils)."
            }
            </script>
        </lc-ai-recommendation>
        <!-- /SLOT: insight -->
    </div>
</main>

<lc-toast-region></lc-toast-region>
<!-- Kit de composants <lc-*> bundlé en script classique (marche en file://, zéro serveur). -->
<script src="lightning-kit.js"></script>
</body>
</html>
