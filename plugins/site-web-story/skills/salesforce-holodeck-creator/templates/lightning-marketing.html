<!DOCTYPE html>
<!-- ┌─────────────────────────────────────────────────────────────────────┐
     │ TEMPLATE — Lightning : Marketing Cloud (desktop)                      │
     │ CHROME VERROUILLÉE : header Lightning + composants <lc-*> du kit.      │
     │ 6 surfaces empilées en 1/1, chacune RETIRABLE : vide le SLOT pour la   │
     │ masquer (un acte montre en général UNE surface — Journey OU Email…).   │
     │ NE MODIFIE QUE le JSON entre les marqueurs SLOT (autour des <script>). │
     │ Les panneaux Agentforce (email-studio) / Einstein (segment) = clins    │
     │ d'œil produit : garde-les quand la surface est affichée.               │
     └─────────────────────────────────────────────────────────────────────┘ -->
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title><!-- SLOT: title -->Lightning — Marketing Cloud<!-- /SLOT --></title>
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="lightning-kit.css">
<style>
    body { background: var(--lc-page); min-height: 100vh; --sf-w: 1440px; }
    .mk-page { width: min(var(--sf-w), 100%); margin: 0 auto; padding: 18px 20px 72px; display: grid; gap: 16px; }
    /* chaque surface est une rangée 1/1 (bandeau, workspace, canvas, studio, tableau) */
    .mk-page > * { grid-column: 1 / -1; }
</style>
</head>
<body>
<div class="act-tag"><!-- SLOT: act-tag -->Acte 1 · Lightning — Marketing Cloud<!-- /SLOT --></div>

<!-- ═══ Header Salesforce Lightning (chrome verrouillée). Ne modifie que sf-logo / sf-app / sf-tabs / sf-avatar. ═══ -->
<div class="lightning">
    <div class="ln-top">
        <!-- SLOT: sf-logo ─ logo du CLIENT (remplace le cloud Salesforce) : wordmark .brand, ou une balise img de classe brand-logo pointant sur le logo fourni. -->
        <span class="ln-logo"><span class="brand"><span class="brand-mark">N</span> Nova</span></span>
        <!-- /SLOT: sf-logo -->
        <div class="ln-search">
            <svg viewBox="0 0 520 520" fill="currentColor"><path d="M496 453 362 320a189 189 0 1 0-340-92 190 190 0 0 0 298 135l133 133a14 14 0 0 0 21 0l21-21a17 17 0 0 0 1-22M210 338a129 129 0 1 1 130-130 129 129 0 0 1-130 130"/></svg>
            Search…
        </div>
        <span class="ln-ask"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4z"/></svg> Ask</span>
        <div class="ln-icons">
            <svg viewBox="0 0 520 520" fill="currentColor"><path d="m274 31 46 150c2 6 8 9 14 9h150c15 0 21 20 9 29l-122 90c-5 4-7 11-5 17l58 154c4 14-11 26-23 17l-131-98c-5-4-12-4-18 0l-132 98c-12 9-28-3-23-17l56-154c2-6 0-13-5-17L26 219c-12-9-5-29 9-29h150c7 0 12-2 14-9l47-151c4-14 24-13 28 1"/></svg>
            <svg viewBox="0 0 520 520" fill="currentColor"><path d="M284 380h-50c-8 0-14-6-14-14v-15c0-42 27-80 67-94a80 80 0 0 0-24-155c-22-1-43 7-59 22a70.4 70.4 0 0 0-23 44c-1 6-7 11-15 11h-50c-9 0-16-7-15-16 4-38 21-72 48-99 32-30 73-46 117-45 83 3 151 71 154 154 3 70-40 133-105 157-9 4-15 11-15 20v15c0 9-8 15-16 15m16 105c0 8-7 15-15 15h-50c-8 0-15-7-15-15v-50c0-8 7-15 15-15h50c8 0 15 7 15 15z"/></svg>
            <svg viewBox="0 0 520 520" fill="currentColor"><path d="M261 191c-39 0-70 31-70 70s31 70 70 70 70-31 70-70-31-70-70-70m210 133-37-31a195 195 0 0 0 0-68l37-31c12-10 16-28 8-42l-16-28a34 34 0 0 0-40-14l-46 17a168 168 0 0 0-59-34l-8-47c-3-16-17-25-33-25h-32c-16 0-30 9-33 25l-8 46a180 180 0 0 0-60 34l-46-17-11-2c-12 0-23 6-29 16l-16 28c-8 14-5 32 8 42l37 31a195 195 0 0 0 0 68l-37 31a34 34 0 0 0-8 42l16 28a34 34 0 0 0 40 14l46-17c18 16 38 27 59 34l8 48a33 33 0 0 0 33 27h32c16 0 30-12 33-28l8-48a170 170 0 0 0 62-37l43 17 12 2c12 0 23-6 29-16l15-26c9-11 5-29-7-39m-210 47c-61 0-110-49-110-110s49-110 110-110 110 49 110 110-49 110-110 110"/></svg>
            <span class="ln-bell"><svg viewBox="0 0 520 520" fill="currentColor"><path d="M460 330h-5a35 35 0 0 1-35-35V180A160 160 0 0 0 252 20c-86 4-152 78-152 165v111c0 19-16 34-35 34h-5c-22 0-40 19-40 41v15c0 7 7 14 15 14h450c8 0 15-7 15-15v-15a40 40 0 0 0-40-40M309 440h-98a10 10 0 0 0-10 12c5 28 30 48 59 48s54-21 59-48a10 10 0 0 0-10-12"/></svg><span class="badge">8</span></span>
            <!-- SLOT: sf-avatar ─ photo de l'utilisateur SF (haut droite). <img class="ln-avatar" src="people/…" alt="">, ou <span class="ln-avatar"></span> pour le dégradé. -->
            <img class="ln-avatar" src="people/femme-2.jpg" alt="">
            <!-- /SLOT: sf-avatar -->
        </div>
    </div>
    <div class="ln-nav">
        <span class="ln-waffle"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
        <!-- SLOT: sf-app ─ nom de l'app Salesforce (ex. Marketing, Marketing Cloud, Campagnes). -->
        <span class="ln-app">Marketing</span>
        <!-- /SLOT: sf-app -->
        <!-- SLOT: sf-tabs ─ onglets. Le 1er en .ln-tab.on = actif (souligné bleu). Ajoute la <svg class="caret"> pour un menu déroulant. -->
        <div class="ln-tabs">
            <span class="ln-tab on">Campagnes</span>
            <span class="ln-tab">Parcours <svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></span>
            <span class="ln-tab">Segments</span>
            <span class="ln-tab">Analytics</span>
        </div>
        <!-- /SLOT: sf-tabs -->
    </div>
</div>

<main class="mk-page">
    <!-- SLOT: header ─ bandeau de campagne (lc-marketing-header). Garde le <script JSON> ; ajuste title/subtitle/status/actions/metrics. -->
    <lc-marketing-header>
        <script type="application/json">
        {
          "type": "Campagne", "status": "Brouillon",
          "title": "Élégance en mouvement",
          "subtitle": "Lancement mobilité électrique premium · France",
          "actions": [
            { "label": "Modifier", "action": "edit-campaign" },
            { "label": "Activer", "action": "activate-campaign", "primary": true }
          ],
          "metrics": [
            { "label": "Membres de la campagne", "value": "84 290" },
            { "label": "Messages", "value": "3" },
            { "label": "Budget", "value": "420 k€" },
            { "label": "Revenu attribué", "value": "1,86 M€" }
          ]
        }
        </script>
    </lc-marketing-header>
    <!-- /SLOT: header -->

    <!-- SLOT: campaign ─ espace campagne (lc-campaign-workspace) : segments de départ + messages. RETIRABLE (vide le SLOT). Garde le <script JSON> ; ajuste title/status/owner/flowType/segments/messages. -->
    <lc-campaign-workspace>
        <script type="application/json">
        {
          "title": "Élégance en mouvement",
          "status": "Brouillon",
          "owner": "Camille Fontaine",
          "flowType": "Flux déclenché par segment",
          "segments": [
            { "name": "Fins de contrat de leasing", "population": "84 290" },
            { "name": "Intention mobilité premium", "population": "18 420" }
          ],
          "messages": [
            { "channel": "Email", "title": "L'art d'arriver", "subject": "{!Prénom}, réinventez la route avec Nova", "status": "Brouillon" },
            { "channel": "WhatsApp", "title": "Votre avant-première privée vous attend", "subject": "Réservez votre essai exclusif", "status": "Prêt" },
            { "channel": "Email", "title": "L'avenir est en mouvement", "subject": "Dernière chance d'accéder au lancement privé", "status": "Brouillon" }
          ]
        }
        </script>
    </lc-campaign-workspace>
    <!-- /SLOT: campaign -->

    <!-- SLOT: journey ─ canvas de parcours (lc-journey-builder), la surface signature MC. RETIRABLE. Garde le <script JSON>. Les nodes se placent sur une grille (row/column) reliée par un connecteur SVG fixe : GARDE le schéma start→email→wait→decision→(3 branches low/medium/high)→…→end (rows 1-7) pour que les traits tombent juste. Ajuste les titres/subtitles. -->
    <lc-journey-builder>
        <script type="application/json">
        {
          "title": "Flux Élégance en mouvement · V1",
          "saved": "Enregistré il y a quelques secondes",
          "status": "Brouillon",
          "nodes": [
            { "id": "start", "type": "start", "title": "Flux déclenché par segment", "subtitle": "Début", "row": 1, "column": 2 },
            { "id": "welcome", "type": "email", "title": "Bienvenue dans Élégance en mouvement", "subtitle": "Envoyer un email", "row": 2, "column": 2 },
            { "id": "wait", "type": "wait", "title": "Attendre 2 jours", "subtitle": "Attendre un délai", "row": 3, "column": 2 },
            { "id": "decision", "type": "decision", "title": "Score d'engagement", "subtitle": "Décision", "row": 4, "column": 2 },
            { "id": "low", "type": "email", "title": "Nurturing engagement faible", "subtitle": "Envoyer un email", "branch": "Faible", "row": 5, "column": 1 },
            { "id": "medium", "type": "email", "title": "Inviter à l'avant-première privée", "subtitle": "Envoyer un email", "branch": "Moyen", "row": 5, "column": 2 },
            { "id": "high", "type": "whatsapp", "title": "Contacter le lead à forte intention", "subtitle": "Envoyer un WhatsApp", "branch": "Élevé", "row": 5, "column": 3 },
            { "id": "call", "type": "action", "title": "Appeler le contact", "subtitle": "Action commerciale", "row": 6, "column": 2 },
            { "id": "assign", "type": "assignment", "title": "Affecter au conseiller dédié", "subtitle": "Affectation", "row": 6, "column": 3 },
            { "id": "end", "type": "end", "title": "Fin", "subtitle": "Parcours terminé", "row": 7, "column": 2 }
          ],
          "picker": ["Test de chemin", "Trier la collection", "Filtrer la collection", "Attendre un délai", "Attendre une date", "Attendre un événement", "Décision Einstein", "Envoyer un email", "Envoyer un SMS", "Envoyer un WhatsApp"]
        }
        </script>
    </lc-journey-builder>
    <!-- /SLOT: journey -->

    <!-- SLOT: email ─ éditeur email 3 volets (lc-email-studio) : palette · aperçu · Agentforce (clin d'œil produit, garde-le). RETIRABLE. Garde le <script JSON> ; ajuste subject/preheader/components/email/assistant. -->
    <lc-email-studio>
        <script type="application/json">
        {
          "title": "Élégance en mouvement · Avant-première privée",
          "subject": "Votre invitation à vivre l'élégance électrique",
          "preheader": "Une avant-première privée pensée pour vous",
          "viewMode": "Desktop",
          "components": ["Bouton", "Séparateur", "Titre", "HTML", "Image", "Liste", "Paragraphe", "Deux colonnes"],
          "email": {
            "brand": "NOVA",
            "eyebrow": "AVANT-PREMIÈRE PRIVÉE",
            "headline": "L'élégance a un nouveau rythme.",
            "body": "Découvrez la Nova One, où la performance silencieuse rencontre un design réfléchi. Votre avant-première privée est prête.",
            "cta": "Réservez votre essai privé",
            "hero": "NOVA ONE",
            "footer": "Invitation réservée à une sélection de clients Nova."
          },
          "assistant": [
            { "role": "assistant", "text": "Je peux affiner les objets, raccourcir le texte ou adapter ce message à un autre canal." },
            { "role": "user", "text": "Rends le titre plus exclusif." },
            { "role": "assistant", "text": "Variante suggérée : Une expression privée de l'élégance électrique, réservée à vous." }
          ]
        }
        </script>
    </lc-email-studio>
    <!-- /SLOT: email -->

    <!-- SLOT: segment ─ constructeur de segment 3 volets (lc-segment-builder) : attributs · règles · Einstein (clin d'œil produit, garde-le). RETIRABLE. Garde le <script JSON> ; ajuste title/object/population/totalPopulation/attributes/rules/assistant. -->
    <lc-segment-builder>
        <script type="application/json">
        {
          "title": "Forte intention mobilité électrique",
          "object": "Individu unifié",
          "population": 84290,
          "totalPopulation": 5286468,
          "description": "Clients montrant une intention récente de mobilité premium et un fort engagement.",
          "attributes": ["Activité de parcours", "Engagement canal", "Compte", "Fidélité", "Engagement site web", "Historique de commandes", "Offre promotionnelle", "Usage app mobile"],
          "rules": [
            { "group": "Engagement email", "count": "Au moins 1", "conditions": ["Type d'engagement est Ouverture", "Date de l'événement il y a moins de 90 jours"] },
            { "group": "Activité de parcours", "count": "Au moins 1", "conditions": ["Type d'activité est Parcours terminé", "Date d'activité il y a moins de 90 jours"] },
            { "group": "Comportement web", "count": "Au moins 1", "conditions": ["URL de page égale /nova-one", "URL de page contient /avant-premiere-privee"] }
          ],
          "assistant": [
            { "role": "user", "text": "Crée un segment de clients à forte intention de mobilité premium sur les 90 derniers jours." },
            { "role": "assistant", "text": "Le brouillon de segment est prêt. Il combine engagement email, activité de parcours et comportement web récent." }
          ]
        }
        </script>
    </lc-segment-builder>
    <!-- /SLOT: segment -->

    <!-- SLOT: performance ─ résultats par canal (lc-marketing-performance) : sparklines + tableau d'envois. RETIRABLE. Garde le <script JSON> ; ajuste channels/metrics/campaigns. -->
    <lc-marketing-performance>
        <script type="application/json">
        {
          "title": "Activité par canal",
          "meta": "Suivez les tendances de performance par canal pour améliorer l'engagement.",
          "channels": ["Email", "SMS", "WhatsApp", "App mobile", "Web"],
          "activeChannel": "Email",
          "metrics": [
            { "label": "Taux de clic", "value": "16,67 %", "change": "+2,4 pts", "direction": "up", "values": [8, 11, 10, 13, 12, 15, 16.67] },
            { "label": "Emails envoyés", "value": "84,3 k", "change": "+14,3 %", "direction": "up", "values": [58, 61, 64, 67, 72, 78, 84.3] },
            { "label": "Emails ouverts", "value": "42,6 k", "change": "+21,2 %", "direction": "up", "values": [25, 28, 31, 34, 37, 40, 42.6] },
            { "label": "Emails cliqués", "value": "14,1 k", "change": "+18,8 %", "direction": "up", "values": [7, 8, 9, 10, 11, 13, 14.1] },
            { "label": "Taux d'ouverture", "value": "50,53 %", "change": "+3,3 pts", "direction": "up", "values": [43, 45, 44, 47, 48, 49, 50.53] },
            { "label": "Taux de désabonnement", "value": "0,18 %", "change": "−0,04 pts", "direction": "up", "values": [0.31, 0.29, 0.27, 0.25, 0.22, 0.2, 0.18] }
          ],
          "campaigns": [
            { "name": "Élégance en mouvement", "channel": "Email", "sent": "42 180", "delivered": "41 920", "opens": "22 640", "clicks": "7 480", "ctr": "17,84 %", "revenue": "1,12 M€" },
            { "name": "Relance avant-première", "channel": "WhatsApp", "sent": "18 420", "delivered": "18 102", "opens": "14 920", "clicks": "4 210", "ctr": "23,26 %", "revenue": "486 k€" },
            { "name": "Renouvellement fin de leasing", "channel": "Email", "sent": "23 690", "delivered": "23 210", "opens": "11 080", "clicks": "2 410", "ctr": "10,38 %", "revenue": "254 k€" }
          ]
        }
        </script>
    </lc-marketing-performance>
    <!-- /SLOT: performance -->
</main>

<lc-toast-region></lc-toast-region>
<!-- Kit de composants <lc-*> bundlé en script classique (marche en file://, zéro serveur). -->
<script src="lightning-kit.js"></script>
</body>
</html>
